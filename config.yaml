server:
  host: 127.0.0.1
  port: 8787

character: characters/natsume.md

memory:
  sqlite_path: data/memory.sqlite
  # P2-B：方案允许 Chroma 或 LanceDB。这里用嵌入式 LanceDB，目录 gitignore。
  vector_backend: lancedb
  vector_path: data/vectors
  retrieve_k: 5
  style_max: 8
  extract_every_n: 8
  episode_min_score: 0.35
  diary_keep: 5
  mood:
    enabled: true
    decay_per_hour: 0.05
    cycle_enabled: false

gateway:
  dedup_ttl_s: 600

# 密钥只来自环境变量 LLM_API_KEY / LLM_BASE_URL / LLM_MODEL
llm:
  provider: openai_compatible
  timeout_s: 60
  disable_thinking: true

speech:
  # P3-A：本机 GPT-SoVITS api_v2。P3-B/C：Fun-ASR-Nano + fsmn-vad，失败再 Faster-Whisper small。
  tts_api_base: http://127.0.0.1:9880
  tts_text_lang: ja
  tts_timeout_s: 60
  tts_ref_dir: data/natsume/references
  tts_cache_dir: data/tts_cache
  tts_gpt_weights: data/natsume/weights/natsume-e15.ckpt
  tts_sovits_weights: data/natsume/weights/natsume_e8_s1104.pth
  asr_model: fun-asr-nano

channels:
  web:
    enabled: true
  voice:
    enabled: true
  qq:
    enabled: false
  wechat:
    enabled: false
    experimental: true
