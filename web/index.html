<!DOCTYPE html>
<html lang="zh-CN">

    <title>四季夏目</title>
    <link rel="stylesheet" href="/assets/style.css" />

  <body>
    <main class="app">

        <span id="character-name">四季夏目</span>
        <a class="memory-link" href="/memory">记忆</a>

      <p id="status" class="status">连接中…</p>
    </main>
    <script src="/assets/app.js"></script>
